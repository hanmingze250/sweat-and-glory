<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="火箭切换">
<title>小火箭节点切换</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: flex-start; justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; color: #1c1c1e;
    padding: 28px 14px;
    background:
      radial-gradient(420px 300px at 15% 10%, rgba(255,196,120,.85), transparent 70%),
      radial-gradient(500px 380px at 90% 30%, rgba(190,150,105,.75), transparent 70%),
      radial-gradient(600px 500px at 50% 100%, rgba(120,90,60,.55), transparent 70%),
      linear-gradient(160deg, #e8d9c3, #cbb493 55%, #a98f6f);
  }
  /* ===== 毛玻璃卡片 ===== */
  .card {
    width: 100%; max-width: 460px; border-radius: 34px; padding: 26px 24px 20px;
    background: rgba(255,255,255,.62);
    -webkit-backdrop-filter: blur(22px) saturate(1.6);
    backdrop-filter: blur(22px) saturate(1.6);
    border: 1px solid rgba(255,255,255,.75);
    box-shadow: 0 24px 60px rgba(80,55,20,.28), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .toprow { display: flex; align-items: flex-start; gap: 8px; }
  #nodeBtn {
    flex: 1; text-align: left; background: none; border: 0; padding: 0; cursor: pointer; color: inherit;
  }
  #nodeName { display: block; font-size: 27px; font-weight: 800; line-height: 1.25; letter-spacing: .2px; }
  #nodeName .caret { font-size: 17px; font-weight: 600; color: #8a8a8e; margin-left: 4px; }
  #confName { display: block; margin-top: 6px; font-size: 15px; font-weight: 600; color: #7a7a7e; letter-spacing: .6px; }
  #refreshBtn {
    width: 40px; height: 40px; border-radius: 50%; border: 0; cursor: pointer; flex: none;
    background: rgba(255,255,255,.55); color: #8a8a8e; font-size: 21px; line-height: 40px;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }
  #refreshBtn.spin { animation: sp .6s ease; }
  @keyframes sp { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* ===== 下拉菜单（切换节点） ===== */
  #menu {
    display: none; margin-top: 14px; border-radius: 20px; overflow: hidden;
    background: rgba(255,255,255,.75); box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }
  #menu.open { display: block; }
  .mi {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 12px 16px;
    background: none; border: 0; border-bottom: 1px solid rgba(0,0,0,.05);
    font-size: 16.5px; color: #1c1c1e; cursor: pointer; text-align: left;
  }
  .mi:last-child { border-bottom: 0; }
  .mi:active { background: rgba(0,0,0,.05); }
  .mi .dot { width: 9px; height: 9px; border-radius: 50%; background: #f79009; flex: none; visibility: hidden; }
  .mi.cur .dot { visibility: visible; }
  .mi.cur { font-weight: 700; }
  .mi .nm { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mi .ms { font-size: 14px; font-weight: 600; color: #2da44e; }
  .mi .ms.bad { color: #d64541; }
  .mi .ms.none { color: #aeaeb2; font-weight: 400; }
  .mi.empty { opacity: .4; cursor: default; }
  .menufoot { padding: 9px 16px; font-size: 12.5px; color: #8a8a8e; background: rgba(0,0,0,.03); }
  .menufoot a { color: #0a6cff; text-decoration: none; cursor: pointer; }

  /* ===== 流量统计（快照） ===== */
  .stats { margin-top: 20px; font-size: 16.5px; color: #3a3a3c; }
  .stats .r { display: flex; align-items: center; gap: 10px; padding: 5px 0; flex-wrap: nowrap; }
  .stats .cell { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
  .stats .sep { color: rgba(0,0,0,.18); }
  .stats .ic { color: #6e6e73; font-size: 17px; }
  .cap { margin-top: 4px; font-size: 11.5px; color: #a08c6d; }

  /* ===== 底部：两个滑块 + 旁边两个选项 ===== */
  .controls { display: flex; gap: 14px; margin-top: 20px; align-items: stretch; }
  .sliders { display: flex; flex-direction: column; gap: 14px; flex: 1.25; }
  .opts { display: flex; flex-direction: column; gap: 14px; flex: 1; }
  .lab { font-size: 12.5px; color: #8a8a8e; margin-bottom: 5px; }
  /* 配置/代理滑块 */
  .seg {
    position: relative; display: flex; height: 46px; border-radius: 23px; padding: 3px;
    background: rgba(120,120,128,.18); cursor: pointer; user-select: none;
  }
  .seg .knob {
    position: absolute; top: 3px; left: 3px; width: calc(50% - 3px); height: 40px; border-radius: 20px;
    background: rgba(255,255,255,.92); box-shadow: 0 2px 8px rgba(0,0,0,.18);
    transition: left .22s ease;
  }
  .seg.proxy .knob { left: 50%; }
  .seg span {
    flex: 1; display: flex; align-items: center; justify-content: center;
    font-size: 16.5px; font-weight: 600; color: #6e6e73; z-index: 1; transition: color .22s;
  }
  .seg span.on { color: #1c1c1e; }
  /* 开关滑块 */
  .swrow { display: flex; align-items: center; gap: 10px; height: 46px; }
  .switch { position: relative; width: 62px; height: 38px; flex: none; cursor: pointer; }
  .switch input { display: none; }
  .track {
    position: absolute; inset: 0; border-radius: 19px; background: rgba(120,120,128,.32);
    transition: background .22s;
  }
  .thumb {
    position: absolute; top: 3px; left: 3px; width: 32px; height: 32px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 8px rgba(0,0,0,.25); transition: left .22s ease;
  }
  .switch input:checked ~ .track { background: #34c759; }
  .switch input:checked ~ .thumb { left: 27px; }
  .swstate { font-size: 16.5px; font-weight: 600; color: #3a3a3c; }
  /* 旁边两个选项 */
  .optbtn {
    flex: 1; border: 0; border-radius: 16px; cursor: pointer; font-size: 16px; font-weight: 600;
    background: rgba(255,255,255,.6); color: #1c1c1e; box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
    display: flex; align-items: center; justify-content: center; min-height: 46px;
  }
  .optbtn:active { background: rgba(255,255,255,.9); }

  #status { margin-top: 14px; font-size: 13.5px; min-height: 18px; color: #9a6a12; }
  #editBox { display: none; margin-top: 12px; }
  #editBox textarea {
    width: 100%; height: 205px; font-size: 14px; padding: 10px; border-radius: 14px;
    border: 1px solid rgba(0,0,0,.08); background: rgba(255,255,255,.75); color: #1c1c1e;
  }
  #editBox label { display: block; font-size: 12px; color: #6e6e73; margin-bottom: 8px; line-height: 1.6; }
  .ebtns { display: flex; gap: 10px; margin-top: 10px; }
  .ebtns button {
    flex: 1; padding: 11px 0; border-radius: 12px; border: 0; cursor: pointer;
    font-size: 15px; font-weight: 600; background: rgba(255,255,255,.7); color: #1c1c1e;
    box-shadow: inset 0 0 0 1px rgba(0,0,0,.05);
  }
  .hint { margin-top: 12px; font-size: 11.5px; line-height: 1.6; color: #8a7658; }
</style>
</head>
<body>
<div class="card">
  <div class="toprow">
    <button id="nodeBtn" title="点这里切换节点">
      <span id="nodeName">—<span class="caret">▾</span></span>
      <span id="confName">CHATGPT-0914-META-MERGED</span>
    </button>
    <button id="refreshBtn" title="刷新">↻</button>
  </div>

  <div id="menu"></div>

  <div class="stats">
    <div class="r">
      <span class="cell"><span class="ic">📶</span>961.9 MB</span><span class="sep">|</span>
      <span class="cell"><span class="ic">📡</span>199.8 MB</span><span class="sep">|</span>
      <span class="cell"><span class="ic">✓</span>10429</span>
    </div>
    <div class="r">
      <span class="cell"><span class="ic">↓</span>1.08 GB</span><span class="sep">|</span>
      <span class="cell"><span class="ic">↑</span>82.7 MB</span><span class="sep">|</span>
      <span class="cell"><span class="ic">✕</span>0</span>
    </div>
    <div class="cap">流量统计为 10:42 截图那一刻的快照（小火箭不对外提供实时流量数据）</div>
  </div>

  <div class="controls">
    <div class="sliders">
      <div>
        <div class="lab">全局路由</div>
        <div class="seg" id="routeSeg">
          <div class="knob"></div>
          <span id="segConfig" class="on">配置</span>
          <span id="segProxy">代理</span>
        </div>
      </div>
      <div>
        <div class="lab">VPN 开关</div>
        <div class="swrow">
          <label class="switch">
            <input type="checkbox" id="vpnSw">
            <span class="track"></span><span class="thumb"></span>
          </label>
          <span class="swstate" id="vpnState">已关闭</span>
        </div>
      </div>
    </div>
    <div class="opts">
      <button class="optbtn" id="editBtn">✎ 编辑节点</button>
      <button class="optbtn" id="resetBtn">↺ 恢复默认</button>
    </div>
  </div>

  <div id="status"></div>

  <div id="editBox">
    <label>共 9 行，一行一个位（留空行 = 空位）。格式：节点名 或 节点名|ms<br>
    节点名必须与小火箭里存的名字一字不差（无空格版，如：美国USLA-A、台湾-优化2-GPT）：</label>
    <textarea id="nodeEdit"></textarea>
    <div class="ebtns">
      <button id="saveEdit">保存</button>
      <button id="cancelEdit">取消</button>
    </div>
  </div>

  <p class="hint">
    点顶部节点名 → 下拉菜单里选节点即切换。配置/代理滑块和 VPN 开关都会真的调用小火箭。<br>
    iPhone：Safari 打开 → 分享 →「添加到主屏幕」；Mac：Safari 打开 → 文件 →「添加到程序坞」。
  </p>
</div>

<script>
// ===== 9 个位：已录入 7 个，后 2 个空位 =====
var DEFAULT_SLOTS = [
  { n: "美国USLA-A",       ms: "158ms" },
  { n: "美国LA-优化-GPT",  ms: "超时" },
  { n: "美国LA-优化2-GPT", ms: "超时" },
  { n: "美国LA-优化3-GPT", ms: "超时" },
  { n: "台湾-优化",        ms: "超时" },
  { n: "台湾-优化2-GPT",   ms: "超时" },
  { n: "台湾-优化3",       ms: "超时" },
  { n: "", ms: "" },
  { n: "", ms: "" }
];
var DEFAULT_CURRENT = "美国LA-优化2-GPT"; // 与你 10:42 截图里的小火箭当前节点一致

var K_SLOTS = "rocketSlots.v3", K_CUR = "rocketCurrent.v3",
    K_ROUTE = "rocketRoute.v3", K_VPN = "rocketVpn.v3";

function loadSlots() {
  try {
    var s = JSON.parse(localStorage.getItem(K_SLOTS) || "null");
    if (Array.isArray(s) && s.length) {
      while (s.length < 9) s.push({ n: "", ms: "" });
      return s.slice(0, 9);
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_SLOTS));
}
function saveSlots(l) { localStorage.setItem(K_SLOTS, JSON.stringify(l)); }
function pretty(name) { return name.replace(/([\u4e00-\u9fff])([A-Za-z0-9])/g, "$1 $2"); }

var statusEl = document.getElementById("status");
var menuEl = document.getElementById("menu");
var nodeNameEl = document.getElementById("nodeName");

function current() { return localStorage.getItem(K_CUR) || DEFAULT_CURRENT; }
function setCurrent(n) { localStorage.setItem(K_CUR, n); }

function renderTop() {
  nodeNameEl.innerHTML = "";
  nodeNameEl.appendChild(document.createTextNode(pretty(current())));
  var c = document.createElement("span");
  c.className = "caret"; c.textContent = "▾";
  nodeNameEl.appendChild(c);
}
function renderMenu() {
  var slots = loadSlots(), cur = current();
  menuEl.innerHTML = "";
  slots.forEach(function (s, idx) {
    var b = document.createElement("button");
    if (!s.n) {
      b.className = "mi empty";
      b.innerHTML = '<span class="dot"></span><span class="nm">空位 ' + (idx + 1) + '</span><span class="ms none">—</span>';
    } else {
      b.className = "mi" + (s.n === cur ? " cur" : "");
      var msCls = s.ms ? (s.ms.indexOf("超时") >= 0 ? "ms bad" : "ms") : "ms none";
      b.innerHTML = '<span class="dot"></span><span class="nm"></span><span class="' + msCls + '">' + (s.ms || "—") + '</span>';
      b.querySelector(".nm").textContent = pretty(s.n);
      b.addEventListener("click", function () { selectNode(s.n); });
    }
    menuEl.appendChild(b);
  });
  var f = document.createElement("div");
  f.className = "menufoot";
  f.innerHTML = '右侧 ms 为上次测速快照。<a id="goTest">去小火箭重新测速 ›</a>';
  menuEl.appendChild(f);
  document.getElementById("goTest").addEventListener("click", function () {
    window.location.href = "shadowrocket://open";
  });
}
function renderAll() { renderTop(); renderMenu(); }

function selectNode(name) {
  setCurrent(name);
  renderAll();
  menuEl.classList.remove("open");
  statusEl.textContent = "正在切换到：" + pretty(name) + " …";
  window.location.href = "shadowrocket://select?s=" + encodeURIComponent(name);
}

document.getElementById("nodeBtn").addEventListener("click", function () {
  menuEl.classList.toggle("open");
});
document.getElementById("refreshBtn").addEventListener("click", function () {
  var b = this;
  b.classList.remove("spin"); void b.offsetWidth; b.classList.add("spin");
  renderAll();
  statusEl.textContent = "已刷新显示（流量/ms 为快照值）。";
});

// ===== 配置/代理滑块 =====
var routeSeg = document.getElementById("routeSeg");
function renderRoute() {
  var r = localStorage.getItem(K_ROUTE) || "config";
  routeSeg.classList.toggle("proxy", r === "proxy");
  document.getElementById("segConfig").classList.toggle("on", r !== "proxy");
  document.getElementById("segProxy").classList.toggle("on", r === "proxy");
}
routeSeg.addEventListener("click", function () {
  var r = (localStorage.getItem(K_ROUTE) || "config") === "proxy" ? "config" : "proxy";
  localStorage.setItem(K_ROUTE, r);
  renderRoute();
  statusEl.textContent = r === "proxy" ? "全局路由切到：代理" : "全局路由切到：配置";
  window.location.href = "shadowrocket://route/" + r;
});
renderRoute();

// ===== VPN 开关滑块 =====
var vpnSw = document.getElementById("vpnSw");
function renderVpn() {
  var on = localStorage.getItem(K_VPN) === "1";
  vpnSw.checked = on;
  document.getElementById("vpnState").textContent = on ? "已开启" : "已关闭";
}
vpnSw.addEventListener("change", function () {
  localStorage.setItem(K_VPN, vpnSw.checked ? "1" : "0");
  renderVpn();
  statusEl.textContent = vpnSw.checked ? "正在开启 VPN…" : "正在关闭 VPN…";
  window.location.href = vpnSw.checked ? "shadowrocket://connect" : "shadowrocket://disconnect";
});
renderVpn();

// ===== 编辑 / 恢复默认 =====
var editBox = document.getElementById("editBox");
var nodeEdit = document.getElementById("nodeEdit");
document.getElementById("editBtn").addEventListener("click", function () {
  nodeEdit.value = loadSlots().map(function (s) { return s.ms ? (s.n + "|" + s.ms) : s.n; }).join("\n");
  editBox.style.display = editBox.style.display === "block" ? "none" : "block";
});
document.getElementById("cancelEdit").addEventListener("click", function () {
  editBox.style.display = "none";
});
document.getElementById("saveEdit").addEventListener("click", function () {
  var lines = nodeEdit.value.split("\n"), list = [];
  for (var i = 0; i < 9; i++) {
    var line = (lines[i] || "").trim();
    if (!line) { list.push({ n: "", ms: "" }); continue; }
    var parts = line.split("|");
    list.push({ n: (parts[0] || "").trim(), ms: (parts[1] || "").trim() });
  }
  saveSlots(list);
  var names = list.map(function (s) { return s.n; });
  if (names.indexOf(current()) < 0) {
    var first = list.filter(function (s) { return s.n; })[0];
    if (first) setCurrent(first.n);
  }
  editBox.style.display = "none";
  renderAll();
  statusEl.textContent = "节点已保存。";
});
document.getElementById("resetBtn").addEventListener("click", function () {
  localStorage.removeItem(K_SLOTS);
  localStorage.removeItem(K_CUR);
  localStorage.removeItem(K_ROUTE);
  renderAll(); renderRoute();
  statusEl.textContent = "已恢复默认（7 个节点 + 2 空位，当前节点为截图那个）。";
});

renderAll();
</script>
</body>
</html>
